name: Build DLS Robot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q dls-robot.zip -d project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project -name "gradlew" -o -name "settings.gradle" -o -name "build.gradle"

      - name: Build APK
        run: |
          GRADLEW=$(find project -name "gradlew" -type f | head -1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "Found Gradle wrapper: $GRADLEW"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "gradlew not found."
            echo "Searching for settings.gradle..."
            SETTINGS=$(find project -name "settings.gradle" -type f | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android Gradle project not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "Project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            sudo apt-get update
            sudo apt-get install -y gradle
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLS-Robot-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
            project/**/build/outputs/apk/*.apk
