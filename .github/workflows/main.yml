name: Build DLS Robot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 21
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-21" "build-tools;21.1.0" "platform-tools"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q dls-robot.zip -d project

      - name: Find project
        run: |
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Build APK
        run: |
          ROOT=$(find project -name "settings.gradle" -type f -print -quit)
          if [ -n "$ROOT" ]; then
            ROOT=$(dirname "$ROOT")
          else
            ROOT=$(find project -name "build.gradle" -type f -print -quit)
            ROOT=$(dirname "$ROOT")
          fi

          echo "Using project root: $ROOT"
          cd "$ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-2.13-bin.zip
            unzip -q gradle.zip -d "$RUNNER_TEMP"
            "$RUNNER_TEMP/gradle-2.13/bin/gradle" assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLS-Robot-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
            project/**/build/outputs/apk/*.apk
